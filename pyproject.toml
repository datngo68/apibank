[project]
name = "apibank"
version = "0.1.0"
description = "Production-grade multi-bank auto payment receiver"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "gunicorn>=23.0.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "cryptography>=44.0.0",
    "python-json-logger>=3.2.0",
    "prometheus-client>=0.21.0",
    "sentry-sdk[fastapi]>=2.19.0",
    "qrcode[pil]>=8.0",
    "pillow>=11.0.0",
    "aiosqlite>=0.20.0",
    "apscheduler>=3.10.4",
    "jinja2>=3.1.4",
    "itsdangerous>=2.2.0",
    "python-multipart>=0.0.20",
    "mbbank-lib>=0.3.0",
    "bcrypt>=4.2.0",
    "pyotp>=2.9.0",
    "email-validator>=2.2.0",
    "pystray>=0.19.5",
]

[project.scripts]
apimb = "apps.cli:main"
apibank = "apps.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
    "testcontainers[postgres,redis]>=4.9.0",
    "ruff>=0.8.0",
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
    "locust>=2.32.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S101", "B008", "S106", "ASYNC109"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=apps --cov=packages --cov-report=term-missing --cov-fail-under=50"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
packages = ["apps", "packages"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mbbank.*", "apscheduler.*", "qrcode.*", "pythonjsonlogger.*"]
ignore_errors = true

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]
exclude = ["infra*", "tests*", "docs*", "alembic*"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
