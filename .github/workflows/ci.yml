name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m mypy apps packages
      - name: pytest
        env:
          APIBANK_DB_URL: sqlite+aiosqlite:///./apibank-ci.db
          APIBANK_FERNET_KEYS: primary:NhnFbDTpYks-q2AmJsBhuG_iL6VDaKL14L4vy44ZqkM=
          APIBANK_API_KEY_SALT: ci-salt
        run: |
          python -m alembic upgrade head
          python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: bundle size budget (gzip <= 260 KB)
        run: |
          set -e
          total=$(find dist/assets -name '*.js' -exec gzip -c {} + | wc -c)
          echo "JS gzip total: $total bytes"
          test "$total" -lt 266240

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: false
          tags: apibank:ci
