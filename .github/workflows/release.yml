name: release

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  image-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags (app)
        id: tags
        run: |
          repo="ghcr.io/${{ github.repository }}"
          tags="${repo}:latest"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tags="${tags},${repo}:${GITHUB_REF_NAME}"
          fi
          tags="${tags},${repo}:sha-${GITHUB_SHA::7}"
          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"
      - name: Build & push apibank
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  image-caddy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags (caddy)
        id: tags
        run: |
          repo="ghcr.io/${{ github.repository }}-caddy"
          tags="${repo}:latest"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tags="${tags},${repo}:${GITHUB_REF_NAME}"
          fi
          tags="${tags},${repo}:sha-${GITHUB_SHA::7}"
          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"
      - name: Build & push apibank-caddy
        uses: docker/build-push-action@v6
        with:
          context: infra/docker/caddy
          file: infra/docker/caddy/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-notes:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [image-app, image-caddy]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
